# Repo-local profiles.yml, not ~/.dbt/profiles.yml.
#
# dbt resolves profiles in this order: --profiles-dir flag, DBT_PROFILES_DIR,
# the current working directory, then ~/.dbt/. Keeping it here means a reviewer
# can clone the repo, `docker compose up -d`, and run dbt with no hidden
# machine-local setup. That is worth more in a portfolio repo than following
# the ~/.dbt convention.
#
# NO SECRETS IN THIS FILE. The dev credentials are the throwaway ones from
# docker-compose.yml and are not sensitive. Everything for prod comes from
# environment variables supplied by .env (gitignored) or CI secrets.

radar:
  target: dev
  outputs:

    # Local Docker Postgres. Seeded from a Neon dump via scripts/seed_dev.sh.
    dev:
      type: postgres
      # Both host and port are overridable so the SAME target works from two
      # places that see the database differently:
      #
      #   from the host      localhost:5433  (RADAR_PG_PORT, published by compose)
      #   inside Airflow     postgres:5432   (the compose service name; set in
      #                                       docker-compose.yml's environment)
      #
      # Defaults are the host view, so `make build` needs nothing set.
      host: "{{ env_var('RADAR_PG_HOST', 'localhost') }}"
      port: "{{ env_var('RADAR_PG_PORT', '5433') | int }}"
      user: radar
      password: radar
      dbname: warehouse
      # Per-developer schema so two people never build over each other. dbt
      # prefixes model schemas onto this, e.g. dbt_tapan_staging.
      schema: dbt_tapan
      threads: 4

    # Neon. Builds into the `analytics` schema; the collector owns `raw` and
    # dbt must never write there. Used by CI and by scheduled prod runs, not
    # for day-to-day development.
    prod:
      type: postgres
      host: "{{ env_var('NEON_HOST') }}"
      port: "{{ env_var('NEON_PORT', '5432') | int }}"
      user: "{{ env_var('NEON_USER') }}"
      password: "{{ env_var('NEON_PASSWORD') }}"
      dbname: "{{ env_var('NEON_DB') }}"
      schema: analytics
      threads: 4
      sslmode: require
      # Neon scales compute to zero when idle; the first connection after a
      # quiet period has a few seconds of cold start. Do not lower this.
      connect_timeout: 30

    # Ephemeral target for pull-request CI. Same Neon instance as prod, but
    # built into a per-PR schema prefix that the workflow drops afterwards.
    #
    # It has to be the SAME database as prod, not a throwaway container:
    # `--defer` resolves unchanged upstream models to relations that must
    # actually exist. A fresh empty Postgres has no `analytics` schema to defer
    # to, so deferral silently degrades into building everything, which is the
    # opposite of Slim CI.
    #
    # dbt appends each model's custom schema to this, so a run produces
    # ci_pr_12_staging, ci_pr_12_intermediate and so on. The cleanup step drops
    # every schema matching the prefix, not just this one.
    ci:
      type: postgres
      host: "{{ env_var('NEON_HOST') }}"
      port: "{{ env_var('NEON_PORT', '5432') | int }}"
      user: "{{ env_var('NEON_USER') }}"
      password: "{{ env_var('NEON_PASSWORD') }}"
      dbname: "{{ env_var('NEON_DB') }}"
      schema: "{{ env_var('DBT_CI_SCHEMA', 'ci_local') }}"
      threads: 4
      sslmode: require
      connect_timeout: 30
