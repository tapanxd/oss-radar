# oss-radar :: tracked repositories
#
# ~45 repos across 6 categories.
#
# VERIFY BEFORE TRUSTING: run the collector dry-run first. Any path that has
# been renamed, transferred, or deleted returns 404 and logs "NOT FOUND".
# Fix or drop those, then run for real.
#
#   python collector/collect.py --config collector/repos.yml --dry-run
#
# Note: GitHub transparently redirects renamed repos via the API, so a rename
# may resolve silently -- the returned `full_name` will differ from what you
# asked for. That difference is itself a `renamed_or_transferred` event and the
# collector stores the returned name, so it gets caught downstream.

repos:

